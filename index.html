<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0d12" />
    <meta
      name="description"
      content="Shibil Muhamed V — Senior Java backend engineer building resilient, low-latency distributed systems with Spring Boot, PostgreSQL, Docker, and cloud platforms."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Shibil Muhamed V — Senior Java Backend Engineer"

    />
    <title>Shibil Muhamed V — Senior Java Backend Engineer</title>
    <script>
      // Dark is the default; a visitor's saved choice wins.
      (function () {
        var stored = localStorage.getItem("theme");
        document.documentElement.setAttribute(
          "data-theme",
          stored === "light" ? "light" : "dark",
        );
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
